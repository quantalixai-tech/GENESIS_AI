[project]
name = "api"
version = "0.1.0"
description = "Genesis Core API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3.0",
    "pydantic[email]>=2.7.0",
    "genesis_db",
    # LLM abstraction layer — per ADR-006 (LiteLLM + Ollama)
    "litellm>=1.44.0",
    # NATS client for agent task dispatch — per ADR-005
    "nats-py>=2.7.0",
    # Git operations for per-project repos — per ADR-009
    "gitpython>=3.1.43",
    # Rate limiting (Phase 10 — security hardening)
    "slowapi>=0.1.9",
    "ollama>=0.6.2",
]

[tool.uv.sources]
genesis_db = { workspace = true }
