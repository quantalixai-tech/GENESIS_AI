# =============================================================================
# Genesis — NATS Server Configuration
# Version: 0.1.0
#
# Documentation: https://docs.nats.io/running-a-nats-service/configuration
# =============================================================================

# Server identity
server_name: genesis-nats

# Client connections
port: 4222

# HTTP monitoring endpoint (used by health checks)
http_port: 8222

# Logging
logtime: true
debug: false
trace: false

# =============================================================================
# JetStream — persistent messaging, event replay, and exactly-once delivery
#
# Required for Genesis event bus patterns:
#   ProjectCreated, WorkspaceOpened, UserLoggedIn, ConfigurationChanged
# =============================================================================
jetstream {
  # Persistent storage for streams and consumers
  store_dir: /data/jetstream

  # Storage limits
  max_mem: 256MB
  max_file_store: 1GB
}

# =============================================================================
# Connection limits
# =============================================================================
max_connections: 1000
max_payload: 8MB
max_pending: 256MB

