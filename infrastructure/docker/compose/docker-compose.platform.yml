services:
  genesis-api:
    build:
      context: ../../../
      dockerfile: apps/api/Dockerfile
    container_name: genesis-api
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-genesis}:${POSTGRES_PASSWORD:-genesis}@genesis-postgres:5432/${POSTGRES_DB:-genesis}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - GENESIS_ENV=${GENESIS_ENV:-development}
      - GENESIS_LOG_LEVEL=${GENESIS_LOG_LEVEL:-info}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    networks:
      - genesis-network
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "genesis.layer=platform"
      - "genesis.service=api"
      - "genesis.version=0.3.0"

  genesis-worker:
    build:
      context: ../../../
      dockerfile: apps/worker/Dockerfile
    container_name: genesis-worker
    restart: unless-stopped
    env_file:
      - ../../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-genesis}:${POSTGRES_PASSWORD:-genesis}@genesis-postgres:5432/${POSTGRES_DB:-genesis}
      - NATS_URL=nats://genesis-nats:4222
    networks:
      - genesis-network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    labels:
      - "genesis.layer=platform"
      - "genesis.service=worker"
      - "genesis.version=0.3.0"

networks:
  genesis-network:
    external: true
