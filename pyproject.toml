[project]
name = "genesis"
version = "0.0.0"
requires-python = ">=3.10"
description = "Genesis Monorepo (Python Workspace)"
dependencies = [
    "docker>=7.2.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/db",
]

[tool.uv.sources]
genesis_db = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",      # async test client for FastAPI
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long — handled by formatter
    "B008",  # do-not-perform-function-call-in-argument-defaults
             # FastAPI's Depends() in function signatures is the canonical pattern
             # and is explicitly exempted by FastAPI docs.
]

[tool.ruff.lint.isort]
known-first-party = ["genesis_db", "core", "services", "schemas", "api"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = [
    "^apps/worker/",  # worker is a stub — minimal type checking for now
]
