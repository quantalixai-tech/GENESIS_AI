[project]
name = "genesis_db"
version = "0.1.0"
description = "Genesis Database Models and Utilities"
requires-python = ">=3.10"
dependencies = [
    "sqlmodel>=0.0.22",
    "alembic>=1.13.2",
    "psycopg2-binary>=2.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genesis_db"]
